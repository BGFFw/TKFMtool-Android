name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test & Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 refs 才能读到 tag 的说明文字（Release 正文用）
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管的 ubuntu runner 自带 Android SDK，直接用它的，
      # 不再依赖 android-actions/setup-android（该 action 在新 runner 上会失败）。
      - name: Install Android SDK packages
        run: |
          set -x
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          echo "APK: $APK"
          "$SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TKFMtool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "build/release/TKFMtool-${GITHUB_REF_NAME}-debug.apk"
          ls -l build/release

      - name: Read tag message
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_message
        run: |
          set -e
          SUMMARY="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${GITHUB_REF_NAME}")"
          BODY="$(git for-each-ref --format='%(contents:body)' "refs/tags/${GITHUB_REF_NAME}")"
          [ -n "$SUMMARY" ] || SUMMARY="Release ${GITHUB_REF_NAME}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          {
            echo "text<<__RELEASE_BODY__"
            echo "## ${SUMMARY}"
            echo
            if [ -n "$BODY" ]; then echo "$BODY"; echo; fi
            echo "### 安装"
            echo
            echo "下载 \`TKFMtool-${GITHUB_REF_NAME}-debug.apk\` 覆盖安装即可（签名与旧版一致，无需卸载）。"
            echo
            echo "### 构建信息"
            echo
            echo "- 提交：\`${SHORT_SHA}\`"
            echo "- 流水线：GitHub Actions（JDK 17 + Android SDK 35）"
            echo "- 单元测试：全部通过后才产出此包"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_message.outputs.text }}
          files: build/release/*.apk
